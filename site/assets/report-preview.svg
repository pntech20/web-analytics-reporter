<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Telegram analytics report preview</title>
  <desc id="desc">A product preview showing a scheduled GA4 report delivered to Telegram.</desc>
  <rect width="1200" height="760" rx="42" fill="#f7faf9"/>
  <rect x="70" y="70" width="470" height="620" rx="28" fill="#ffffff" stroke="#d9e2df" stroke-width="3"/>
  <rect x="104" y="112" width="402" height="64" rx="14" fill="#ecf6f5"/>
  <circle cx="139" cy="144" r="16" fill="#0f8b8d"/>
  <rect x="171" y="132" width="178" height="14" rx="7" fill="#083f4d"/>
  <rect x="171" y="154" width="118" height="10" rx="5" fill="#6d7b80"/>
  <text x="104" y="235" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#101418">Daily website summary</text>
  <text x="104" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#2f3a3d">Users: 1,482 (+18%)</text>
  <text x="104" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#2f3a3d">Sessions: 1,906 (+12%)</text>
  <text x="104" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#2f3a3d">Views: 4,681 (+21%)</text>
  <rect x="104" y="418" width="340" height="18" rx="9" fill="#d8efed"/>
  <rect x="104" y="458" width="287" height="18" rx="9" fill="#d8efed"/>
  <rect x="104" y="498" width="384" height="18" rx="9" fill="#d8efed"/>
  <text x="104" y="573" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#101418">Countries</text>
  <text x="104" y="619" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#2f3a3d">1. United States - 812 users</text>
  <text x="104" y="653" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#2f3a3d">2. Vietnam - 214 users</text>
  <rect x="635" y="96" width="410" height="84" rx="18" fill="#ffffff" stroke="#d9e2df" stroke-width="3"/>
  <text x="666" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#083f4d">vercel cron: 0 8 * * *</text>
  <rect x="635" y="226" width="410" height="84" rx="18" fill="#ffffff" stroke="#d9e2df" stroke-width="3"/>
  <text x="666" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#083f4d">source: GA4 Data API</text>
  <rect x="635" y="356" width="410" height="84" rx="18" fill="#ffffff" stroke="#d9e2df" stroke-width="3"/>
  <text x="666" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#083f4d">destination: Telegram</text>
  <rect x="635" y="486" width="410" height="84" rx="18" fill="#ffffff" stroke="#d9e2df" stroke-width="3"/>
  <text x="666" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#083f4d">site=all or site=docs</text>
  <path d="M542 380h76" stroke="#19a7a5" stroke-width="8" stroke-linecap="round"/>
  <path d="M602 356l28 24-28 24" fill="none" stroke="#19a7a5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1078" cy="648" r="46" fill="#f4b740"/>
  <path d="M1056 650l17 16 30-36" fill="none" stroke="#083f4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
