<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Web Analytics Reporter</title>
  <desc id="desc">Reusable GA4 reports for Telegram and Node.js cron jobs.</desc>
  <rect width="1200" height="630" fill="#f7faf9"/>
  <rect x="72" y="72" width="1056" height="486" rx="42" fill="#ffffff" stroke="#d9e2df" stroke-width="3"/>
  <rect x="118" y="118" width="92" height="92" rx="24" fill="#083f4d"/>
  <path d="M136 181c12-21 28-32 48-32 16 0 30 7 42 22v21h-90v-11z" fill="#19a7a5"/>
  <rect x="145" y="137" width="48" height="36" rx="9" fill="#f8fbfc"/>
  <path d="M155 160l8-8 9 6 13-16" fill="none" stroke="#0f8b8d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="156" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#083f4d">Web Analytics Reporter</text>
